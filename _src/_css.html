<style>
/* ============================================================
   BIZTECH Consulting — one-page site (RO)
   Paletă: documentul principal §3.5 · Dark implicit, Light prin comutator
   ============================================================ */
:root{
  --bg:#1E1829; --bg-deep:#14101F; --surface:#2A2140; --surface-2:#332a4d; --border:#3B2F5C;
  --text:#F5F3FA; --text-2:#B9B3CC;
  --violet:#6B4CD8; --violet-hover:#5A3FC0; --violet-soft:#AD73E9;
  --cyan:#61C0DE; --amber:#F2A35B; --teal:#2A9D8F; --red:#D62828; --brand-red:#F80F0F;
  --wa:#25D366; --wa-hover:#1EBE5D; --wa-text:#062B16;
  --shadow:0 12px 32px rgba(0,0,0,.38); --shadow-sm:0 4px 14px rgba(0,0,0,.28);
  --radius:18px; --radius-sm:12px;
  --font-head:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F7F6FB; --bg-deep:#EFECF6; --surface:#FFFFFF; --surface-2:#F1EEF8; --border:#E4E0EE;
  --text:#1E1829; --text-2:#5C5470;
  --violet:#5A3FC0; --violet-hover:#4B33A6; --violet-soft:#7A5CE0;
  --cyan:#17789A; --amber:#B5651D; --teal:#1F7A6F;
  --shadow:0 12px 32px rgba(30,24,41,.10); --shadow-sm:0 4px 14px rgba(30,24,41,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.6;overflow-x:hidden}
img,video{max-width:100%;height:auto;display:block}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4vw,3.2rem);font-weight:800}
h2{font-size:clamp(1.75rem,3.2vw,2.6rem);font-weight:800}
h3{font-size:1.25rem;font-weight:700}
p{margin:0 0 1em}
strong{font-weight:600}
.container{max-width:1180px;margin:0 auto;padding:0 24px}
section{padding:96px 0}
.section-alt{background:var(--bg-deep)}
.eyebrow{display:inline-block;font-size:.8rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--violet-soft);margin-bottom:14px}
.lead{font-size:1.15rem;color:var(--text-2);max-width:760px}
.section-head{max-width:820px;margin-bottom:48px}
.muted{color:var(--text-2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grad{background:linear-gradient(90deg,var(--violet-soft),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- Butoane ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 24px;border-radius:999px;font-weight:600;font-size:1rem;border:2px solid transparent;cursor:pointer;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s;font-family:var(--font-body);line-height:1.2;text-decoration:none!important;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:20px;height:20px;flex:none}
.wa-ico{width:22px;height:22px;flex:none;display:inline-block}
.btn-sm .wa-ico{width:18px;height:18px}
.btn-lg .wa-ico{width:24px;height:24px}
.btn-wa{background:var(--wa);color:var(--wa-text);box-shadow:0 8px 24px rgba(37,211,102,.28)}
.btn-wa:hover{background:var(--wa-hover)}
.btn-violet{background:var(--violet);color:#fff}
.btn-violet:hover{background:var(--violet-hover)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-outline:hover{border-color:var(--violet-soft)}
.btn-lg{padding:17px 30px;font-size:1.06rem}
@media (max-width:640px){.btn-lg,.cta-row .btn,.cta-block .btn,.band .btn{white-space:normal;text-align:center;width:100%}.cta-row,.cta-block{flex-direction:column;align-items:stretch}}
.btn-sm{padding:10px 16px;font-size:.92rem}
.cta-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.cta-block{margin-top:44px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}

/* ---------- Header ---------- */
.header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.header .container{display:flex;align-items:center;gap:18px;height:74px;max-width:1320px}
.logo{display:flex;align-items:center;flex:none}
.logo img{height:38px;width:auto}
.logo .logo-light{display:none}
[data-theme="light"] .logo .logo-dark{display:none}
[data-theme="light"] .logo .logo-light{display:block}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{color:var(--text-2);font-weight:500;font-size:.92rem;padding:8px 10px;border-radius:8px;text-decoration:none;white-space:nowrap}
.nav a:hover,.nav a.active{color:var(--text);background:color-mix(in srgb,var(--violet) 18%,transparent)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.header-phone{display:flex;flex-direction:column;line-height:1.2;font-size:.8rem;color:var(--text-2);text-align:right;white-space:nowrap}
.header-phone a{color:var(--text);font-weight:600;text-decoration:none}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{border-color:var(--violet-soft)}
.burger{display:none}
.theme-toggle .icon-sun{display:none}
[data-theme="light"] .theme-toggle .icon-sun{display:block}
[data-theme="light"] .theme-toggle .icon-moon{display:none}
@media (max-width:1060px){
  .nav{display:none}
  .header-phone{display:none}
  .burger{display:inline-flex}
  .header.nav-open .nav{display:flex;position:absolute;left:0;right:0;top:74px;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 24px 20px;gap:2px;box-shadow:var(--shadow)}
  .header.nav-open .nav a{padding:12px 10px;font-size:1.05rem}
}
@media (max-width:640px){
  .header .container{height:66px;gap:10px}
  .logo img{height:32px}
  .header-right .btn span{display:none}
  .header-right .btn{padding:8px 10px}
  .header-right .btn .wa-ico{width:24px;height:24px}
  .lang summary{padding:5px 8px 5px 5px}.lang summary .code{display:none}
}

/* ---------- Hero ---------- */
.hero{position:relative;padding:0;color:#F5F3FA;background:#14101F;overflow:hidden;isolation:isolate}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.95}
.hero-overlay{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,16,31,.86) 0%,rgba(20,16,31,.62) 55%,#1E1829 100%)}
[data-theme="light"] .hero-overlay{background:linear-gradient(180deg,rgba(20,16,31,.86) 0%,rgba(20,16,31,.66) 55%,#F7F6FB 100%)}
.hero .container{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-top:88px;padding-bottom:64px;min-height:calc(100vh - 74px)}
.hero h1{margin-bottom:18px}
.hero .product{font-family:var(--font-head);font-size:1.15rem;font-weight:700;color:#fff;margin:0 0 14px}
.hero .product span{color:#AD73E9}
.hero .lead{color:#D9D4E8;font-size:1.08rem;max-width:600px}
.hero .cta-row{margin-top:14px}
.hero .cta-demo{margin-top:26px}
.btn-demo{background:#fff;color:#3A2390;box-shadow:0 8px 24px rgba(255,255,255,.12)}
.btn-demo:hover{background:#EFEAFF}
.hero-phones{margin-top:22px;font-size:.95rem;color:#D9D4E8}
.hero-phones a{color:#fff;font-weight:600;text-decoration:none}
.hero-phones .hours{display:block;margin-top:4px;color:#B9B3CC;font-size:.9rem}
.quick-form{margin-top:26px;background:rgba(42,33,64,.66);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:16px 18px;max-width:560px;backdrop-filter:blur(8px)}
.quick-form label{display:block;font-size:.92rem;color:#E6E1F2;margin-bottom:10px}
.quick-form .row{display:flex;gap:10px}
@media (max-width:480px){.quick-form .row{flex-direction:column}.quick-form .btn{width:100%}}
.quick-form input{flex:1;min-width:0;padding:12px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(20,16,31,.6);color:#fff;font-size:1rem;font-family:var(--font-body)}
.quick-form input::placeholder{color:#8E86A6}
.quick-form small{display:block;color:#9F98B4;margin-top:8px;font-size:.8rem}
.hero-visual{position:relative;min-height:420px}
.laptop{position:relative;border-radius:14px;background:#0E0B16;padding:10px 10px 0;box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);transform:perspective(1200px) rotateY(-8deg) rotateX(2deg)}
.laptop img{border-radius:8px 8px 0 0;width:100%;height:auto}
.laptop::after{content:"";display:block;height:14px;background:linear-gradient(#1B1626,#0E0B16);border-radius:0 0 12px 12px;margin:0 -10px}
.phone{position:absolute;left:-18px;bottom:-26px;width:27%;max-width:170px;border-radius:26px;background:#0E0B16;padding:8px;box-shadow:0 26px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1)}
.phone img{border-radius:20px;width:100%}
@media (max-width:980px){
  .hero .container{grid-template-columns:1fr;padding-top:56px;padding-bottom:56px;min-height:0}
  .hero-visual{min-height:0;margin-top:24px;padding-bottom:36px;padding-left:12px}
  .laptop{transform:none}
  .phone{width:24%;left:-4px;bottom:-14px}
}

/* ---------- Bară de încredere ---------- */
.trust{background:var(--bg-deep);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:26px 0}
.trust .container{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.trust-item{display:flex;gap:12px;align-items:flex-start;font-size:.95rem;color:var(--text-2)}
.trust-item strong{color:var(--text);display:block}
.trust-item svg{width:24px;height:24px;flex:none;color:var(--violet-soft);margin-top:2px}
@media (max-width:900px){.trust .container{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.trust .container{grid-template-columns:1fr}}

/* ---------- Carduri generice ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow-sm)}
.grid{display:grid;gap:22px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ---------- Puncte de durere ---------- */
.pain-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:22px}
.pain-grid .card{grid-column:span 2}
.pain-grid .card:nth-child(4){grid-column:2/span 2}
.pain-num{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--red) 18%,transparent);color:#FF6B6B;font-family:var(--font-head);font-weight:800;margin-bottom:16px}
[data-theme="light"] .pain-num{color:var(--red)}
.pain-grid h3{font-size:1.18rem;margin-bottom:10px}
.pain-grid p{color:var(--text-2);margin:0}
.closing{margin-top:34px;font-size:1.15rem;font-weight:600;max-width:760px}
@media (max-width:980px){.pain-grid{grid-template-columns:1fr 1fr}.pain-grid .card,.pain-grid .card:nth-child(4){grid-column:auto}}
@media (max-width:620px){.pain-grid{grid-template-columns:1fr}}

/* ---------- Beneficii ---------- */
.feature{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding:36px 0}
.feature+.feature{border-top:1px solid var(--border)}
.feature:nth-child(even) .feature-media{order:-1}
.feature h3{font-size:1.45rem}
.feature p{color:var(--text-2)}
.proof{display:inline-block;margin-top:8px;line-height:1.5;padding:10px 16px;border-radius:12px;background:color-mix(in srgb,var(--amber) 16%,transparent);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);color:var(--text);font-size:.95rem}
.proof b{color:var(--amber);font-family:var(--font-head);font-size:1.05rem}
.feature-media{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);background:#0E0B16;aspect-ratio:16/10}
.feature-media img{width:100%;height:100%;object-fit:cover;object-position:top}
.band{margin-top:40px;background:linear-gradient(135deg,var(--violet) 0%,#4A2FB0 60%,#3A2390 100%);color:#fff;border-radius:var(--radius);padding:40px;display:grid;grid-template-columns:1.3fr .7fr;gap:32px;align-items:center;box-shadow:var(--shadow)}
.band h3{color:#fff;font-size:1.6rem}
.band p{color:#E9E4F7}
.band .big{font-family:var(--font-head);font-size:3.4rem;font-weight:800;line-height:1;color:#fff}
.band .big small{display:block;font-size:1rem;font-weight:600;color:#E9E4F7;margin-top:6px}
@media (max-width:900px){.feature{grid-template-columns:1fr;gap:24px}.feature:nth-child(even) .feature-media{order:0}.band{grid-template-columns:1fr}}

/* ---------- Demo ---------- */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 26px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:.9rem;color:var(--text)}
.chip b{color:var(--cyan)}
.carousel-wrap{position:relative}
.carousel{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 6px 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior-x:contain;cursor:grab}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 68%;scroll-snap-align:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.slide .shot{aspect-ratio:16/10;overflow:hidden;background:#0E0B16}
.slide .shot img{width:100%;height:100%;object-fit:cover;object-position:top}
.slide figcaption{padding:14px 18px;font-size:.95rem;color:var(--text-2)}
.slide figcaption b{color:var(--text)}
.car-btn{position:absolute;top:40%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);z-index:2}
.car-btn svg{width:20px;height:20px}
.car-btn.prev{left:-12px}.car-btn.next{right:-12px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:4px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:var(--border);cursor:pointer;padding:0;transition:transform .15s,background .15s}
.dots button.on{background:var(--violet-soft);transform:scale(1.25)}
@media (max-width:720px){.slide{flex-basis:calc(100% - 12px)}.carousel{gap:12px;padding:6px 6px 14px}.car-btn{width:40px;height:40px;top:36%}.car-btn.prev{left:4px}.car-btn.next{right:4px}.car-btn svg{width:18px;height:18px}}

/* ---------- Servicii ---------- */
.service{position:relative}
.service .tag{position:absolute;top:22px;right:22px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--violet) 22%,transparent);color:var(--violet-soft)}
.service .ico{width:52px;height:52px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet-soft);margin-bottom:18px}
.service .ico svg{width:26px;height:26px}
.service h3{font-size:1.3rem}
.service p{color:var(--text-2);margin-bottom:8px}
.service a.more{font-weight:600}

/* ---------- Cum lucrăm ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;counter-reset:step}
.step{position:relative;padding:28px 28px 28px 28px}
.step .n{font-family:var(--font-head);font-weight:800;font-size:2.2rem;color:var(--violet-soft);line-height:1;margin-bottom:12px}
.step h3{font-size:1.15rem}
.step p{color:var(--text-2);margin:0}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
.box{border-radius:var(--radius);padding:24px 28px;display:flex;gap:16px;align-items:flex-start}
.box svg{width:28px;height:28px;flex:none;margin-top:2px}
.box-teal{background:color-mix(in srgb,var(--teal) 16%,transparent);border:1px solid color-mix(in srgb,var(--teal) 45%,transparent)}
.box-teal svg{color:var(--teal)}
.box-violet{background:color-mix(in srgb,var(--violet) 16%,transparent);border:1px solid color-mix(in srgb,var(--violet) 45%,transparent)}
.box-violet svg{color:var(--violet-soft)}
.box strong{display:block;margin-bottom:4px}
.box span{color:var(--text-2);font-size:.97rem}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.steps{grid-template-columns:1fr}.boxes{grid-template-columns:1fr}}

/* ---------- Despre mine ---------- */
.about{display:grid;grid-template-columns:320px 1fr;gap:56px;align-items:start}
.person+.person{margin-top:56px;padding-top:56px;border-top:1px solid var(--border)}
.person-name{font-size:1.6rem;margin-bottom:4px}
.person-role{color:var(--text-2);font-weight:500;margin-bottom:18px}
.portrait{position:sticky;top:100px}
.portrait img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:28px;border:1px solid var(--border);box-shadow:var(--shadow)}
.portrait .name{margin-top:18px;font-family:var(--font-head);font-weight:800;font-size:1.35rem}
.portrait .role{color:var(--text-2);font-size:.95rem}
.portrait .li{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-weight:600}
.portrait .li svg{width:18px;height:18px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}
.fact{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center}
.fact b{display:block;font-family:var(--font-head);font-size:1.35rem;color:var(--violet-soft)}
.fact span{font-size:.85rem;color:var(--text-2)}
.timeline{list-style:none;padding:0;margin:0 0 20px}
.timeline li{position:relative;padding-left:28px;margin-bottom:14px;color:var(--text-2)}
.timeline li::before{content:"";position:absolute;left:0;top:.55em;width:12px;height:12px;border-radius:50%;background:var(--violet-soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 25%,transparent)}
.timeline li b{color:var(--text)}
@media (max-width:900px){.about{grid-template-columns:1fr}.portrait{position:static;max-width:320px}.facts{grid-template-columns:1fr 1fr}.fact b{font-size:1.15rem}}

/* ---------- Portofoliu ---------- */
.case{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start}
.delivered{columns:2;column-gap:28px;padding-left:20px;margin:0 0 20px;color:var(--text-2)}
.delivered li{break-inside:avoid;margin-bottom:8px}
.results{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.result{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px}
.result b{display:block;font-family:var(--font-head);font-size:1.5rem;color:var(--amber);line-height:1.1}
.result span{font-size:.9rem;color:var(--text-2)}
.testimonial{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--violet-soft);border-radius:var(--radius);padding:26px 28px}
.testimonial .quote{font-size:1.12rem;font-style:italic;margin:0 0 14px}
.testimonial details{margin-top:6px}
.testimonial summary{cursor:pointer;font-weight:600;color:var(--cyan);list-style:none}
.testimonial summary::-webkit-details-marker{display:none}
.testimonial details[open] summary{margin-bottom:10px}
.testimonial details p{color:var(--text-2);font-size:.98rem}
.testimonial .who{margin-top:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.testimonial .who b{display:block}
.testimonial .who span{color:var(--text-2);font-size:.9rem}
@media (max-width:900px){.case{grid-template-columns:1fr}.delivered{columns:1}}

/* ---------- FAQ ---------- */
.faq{max-width:860px}
.faq details{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);margin-bottom:12px;padding:0 22px}
.faq summary{cursor:pointer;padding:18px 0;font-weight:600;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.5rem;color:var(--violet-soft);flex:none;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{color:var(--text-2);margin:0 0 18px}

/* ---------- Contact ---------- */
.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px}
.channel{display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);text-decoration:none!important;color:var(--text);transition:transform .15s,border-color .15s}
.channel:hover{transform:translateY(-2px);border-color:var(--violet-soft)}
.channel svg{width:28px;height:28px;color:var(--violet-soft)}
.channel .wa-ico{width:36px;height:36px}
.channel b{font-family:var(--font-head);font-size:1.08rem}
.channel span{color:var(--text-2);font-size:.92rem}
.channel.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-text)}
.channel.wa svg,.channel.wa span{color:var(--wa-text)}
.contact-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:start}
.form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px}
.form .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:.88rem;font-weight:600;margin-bottom:6px;color:var(--text-2)}
.form input,.form select,.form textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;font-family:var(--font-body)}
.form textarea{min-height:110px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--violet-soft);outline-offset:1px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--text-2);margin:16px 0 20px}
.consent input{width:auto;margin-top:4px}
.form .actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0;pointer-events:none}
.form-msg{margin-top:14px;font-size:.95rem;display:none}
.form-msg.ok{display:block;color:var(--teal)}
.form-msg.err{display:block;color:#FF6B6B}
.company{font-size:.97rem;color:var(--text-2)}
.company b{color:var(--text);display:block;font-family:var(--font-head);font-size:1.1rem;margin-bottom:8px}
.company a{color:var(--text)}
.hours-box{margin-top:18px;padding:16px 18px;border-radius:var(--radius-sm);background:color-mix(in srgb,var(--teal) 14%,transparent);border:1px solid color-mix(in srgb,var(--teal) 40%,transparent);font-size:.95rem}
@media (max-width:980px){.channels{grid-template-columns:1fr 1fr}.contact-grid{grid-template-columns:1fr}}
@media (max-width:560px){.channels{grid-template-columns:1fr}.form .fields{grid-template-columns:1fr}}

/* ---------- Footer ---------- */
.footer{background:var(--bg-deep);border-top:1px solid var(--border);padding:40px 0 120px;font-size:.9rem;color:var(--text-2)}
.footer .container{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px}
.footer a{color:var(--text-2)}
.footer .legal{font-size:.82rem;line-height:1.7}
.footer ul{list-style:none;padding:0;margin:0}
.footer li{margin-bottom:8px}
.footer h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text);margin-bottom:12px}
.copy{margin-top:22px;grid-column:1/-1;border-top:1px solid var(--border);padding-top:18px;font-size:.82rem}
@media (max-width:800px){.footer .container{grid-template-columns:1fr}.footer{padding-bottom:110px}}
@media (min-width:769px){.footer{padding-bottom:56px}}

/* ---------- WhatsApp lipicios + bară mobil ---------- */
.fab{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;align-items:center;gap:10px}
.fab-btn{width:66px;height:66px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s;filter:drop-shadow(0 10px 22px rgba(37,211,102,.45))}
.fab-btn:hover{transform:scale(1.06)}
.fab-btn .wa-ico{width:66px;height:66px}
.fab-label{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:10px 14px;font-size:.9rem;font-weight:600;box-shadow:var(--shadow-sm);display:none}
.fab:hover .fab-label{display:block}
.bubble{position:fixed;right:24px;bottom:96px;z-index:60;max-width:300px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);font-size:.93rem;display:none}
.bubble.show{display:block;animation:pop .25s ease-out}
.bubble .x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--text-2);font-size:1.1rem;cursor:pointer}
.bubble .btn{margin-top:10px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.mobile-bar{display:none}
@media (max-width:768px){
  .fab{display:none}
  .bubble{bottom:84px;right:16px;left:16px;max-width:none}
  .mobile-bar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:55;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
  .mobile-bar .btn{padding:12px 8px;font-size:.9rem;border-radius:12px}
  .fab .fab-label{display:none!important}
}

/* ---------- Cookie ---------- */
.cookie{position:fixed;left:24px;bottom:24px;z-index:70;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);font-size:.92rem;display:none}
.cookie.show{display:block}
.cookie p{margin:0 0 12px}
.cookie .actions{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:768px){.cookie{left:12px;right:12px;bottom:84px;max-width:none}}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn:hover,.channel:hover,.fab-btn:hover{transform:none}}

/* ---------- Selector de limbă cu steaguri ---------- */
.lang{position:relative;padding:0;border:0}
.lang summary{list-style:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:999px;padding:6px 12px 6px 6px;font-size:.85rem;font-weight:600;color:var(--text);cursor:pointer;background:transparent}
.lang summary::-webkit-details-marker{display:none}
.lang summary:hover{border-color:var(--violet-soft)}
.flag{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:190px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:70}
.lang-menu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--text);text-decoration:none;font-size:.95rem}
.lang-menu a:hover{background:color-mix(in srgb,var(--violet) 18%,transparent)}
.lang-menu a.on{font-weight:700;color:var(--violet-soft)}
.lang-menu a .code{margin-left:auto;font-size:.78rem;color:var(--text-2);font-weight:600}
.footer .langs a{display:inline-flex;align-items:center;gap:8px;opacity:1;pointer-events:auto}
.footer .langs a.on{color:var(--text);font-weight:600}
.footer .langs .flag{width:20px;height:20px}
.header.nav-open .lang{display:inline-block}
</style>
